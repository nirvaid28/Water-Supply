services:
  db:
    image: mysql:8.0
    container_name: water_billing_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: water_billing_db
    ports:
      - "3306:3306"
    volumes:
      - ./sql/water_billing_system.sql:/docker-entrypoint-initdb.d/01_water_billing_system.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: water_billing_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: water_billing_db
    ports:
      - "8501:8501"

volumes:
  mysql_data:
